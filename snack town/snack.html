<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snack Town</title>

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Bebas+Neue&display=swap"
    rel="stylesheet"
  >

  <style>
    body {
      font-family: "DM Sans", sans-serif;
    }

    .font-western {
      font-family: "Bebas Neue", sans-serif;
      letter-spacing: 0.05em;
    }

    .fade-in {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .product-card {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }


    .product-card img {
      transition: transform 0.5s ease, filter 0.3s ease;
    }

    .product-card:hover img {
      transform: scale(1.06);
      filter: brightness(1.08);
    }

    .image-frame {
      overflow: hidden;
    }

    .btn-primary {
      transition: background 0.3s, transform 0.2s;
    }

    .btn-primary:hover {
      transform: scale(1.05);
    }

    nav {
      backdrop-filter: blur(10px);
    }

    .cart-panel {
      transform: translateX(100%);
      transition: transform 0.3s ease;
    }

    .cart-panel.open {
      transform: translateX(0);
    }

    .cart-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .cart-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
  </style>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brown: "#3E2723",
            wine: "#8B1A1A",
            mustard: "#D4A017",
            cream: "#F5F5DC",
            steel: "#71797E"
          }
        }
      }
    };
  </script>

  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="/_sdk/resizing_sdk.js" type="text/javascript"></script>
</head>

<body
  data-template-id="__page-root"
  class="w-full bg-brown text-cream"
>
  <!-- Barra de navegación -->
  <nav class="fixed top-0 left-0 right-0 z-50 bg-brown/90 border-b border-mustard/20">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <span
        data-template-id="nav-logo"
        class="canva-text font-western text-2xl text-mustard"
      ></span>

      <div class="flex items-center gap-6">
        <div class="hidden md:flex gap-8">
          <a
            href="#inicio"
            class="text-cream/80 hover:text-mustard transition-colors text-sm uppercase tracking-wider"
          >
            Inicio
          </a>

          <a
            href="#productos"
            class="text-cream/80 hover:text-mustard transition-colors text-sm uppercase tracking-wider"
          >
            Productos
          </a>

          <a
            href="#preventa"
            class="text-cream/80 hover:text-mustard transition-colors text-sm uppercase tracking-wider"
          >
            Preventa
          </a>

          <a
            href="#contacto"
            class="text-cream/80 hover:text-mustard transition-colors text-sm uppercase tracking-wider"
          >
            Contacto
          </a>
        </div>

        <button
          id="cart-toggle"
          class="relative text-cream hover:text-mustard transition-colors"
          aria-label="Carrito"
        >
          <i data-lucide="shopping-cart" style="width: 26px; height: 26px;"></i>

          <span
            id="cart-badge"
            class="absolute -top-2 -right-2 bg-wine text-cream text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold hidden"
          >
            0
          </span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Fondo del carrito -->
  <div
    id="cart-overlay"
    class="cart-overlay fixed inset-0 z-[60] bg-black/50"
    onclick="closeCart()"
  ></div>

  <!-- Panel del carrito -->
  <aside
    id="cart-panel"
    class="cart-panel fixed top-0 right-0 z-[70] w-full max-w-sm h-full bg-[#2a1a15] border-l border-mustard/20 flex flex-col"
  >
    <div class="flex items-center justify-between p-6 border-b border-mustard/20">
      <h2
        data-template-id="cart-title"
        class="canva-text font-western text-2xl text-mustard"
      ></h2>

      <button
        onclick="closeCart()"
        class="text-cream/60 hover:text-cream"
        aria-label="Cerrar carrito"
      >
        <i data-lucide="x" style="width: 24px; height: 24px;"></i>
      </button>
    </div>

    <div
      id="cart-items"
      class="flex-1 overflow-y-auto p-6 space-y-4"
    ></div>

    <div
      id="cart-empty"
      class="flex-1 flex items-center justify-center p-6"
    >
      <p
        data-template-id="cart-empty-text"
        class="canva-text text-cream/50 text-center"
      ></p>
    </div>

    <div
      id="cart-footer"
      class="p-6 border-t border-mustard/20 hidden"
    >
      <div class="flex justify-between mb-4">
        <span class="text-cream/80 font-bold">Total:</span>
        <span
          id="cart-total"
          class="text-mustard font-western text-xl"
        ></span>
      </div>

      <button
        id="order-btn"
        onclick="orderWhatsApp()"
        class="w-full py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded uppercase tracking-wider transition-colors flex items-center justify-center gap-2"
      >
        <i data-lucide="message-circle" style="width: 20px; height: 20px;"></i>
        <span>Ordenar por WhatsApp</span>
      </button>
    </div>
  </aside>

  <!-- Inicio -->
  <section
    id="inicio"
    class="relative w-full min-h-screen flex items-center justify-center overflow-hidden bg-brown"
  >
    <img
      data-template-id="hero-bg"
      src="https://images.unsplash.com/photo-1551024601-bec78aea704b?auto=format&fit=crop&w=1800&q=85"
      alt="Snacks y postres de Snack Town"
      class="canva-image absolute inset-0 w-full h-full object-cover opacity-40"
      loading="lazy"
    >

    <div class="absolute inset-0 bg-gradient-to-b from-brown/60 via-brown/40 to-brown"></div>

    <div class="relative z-10 text-center px-6 max-w-4xl">
      

      <h1
        data-template-id="hero-title"
        class="canva-text font-western text-8xl md:text-[10rem] lg:text-[12rem] text-cream mb-4 leading-none"
      >SNACK TOWN</h1>

      <p
        data-template-id="hero-subtitle"
        class="canva-text text-xl md:text-2xl text-cream/80 mb-10"
      ></p>

      <a
        href="#productos"
        data-template-id="hero-cta"
        class="canva-button btn-primary inline-block px-10 py-4 bg-wine text-cream font-bold rounded uppercase tracking-wider"
      >
        Ver productos
      </a>
    </div>
  </section>

  <!-- Nosotros -->
  <section
    id="nosotros"
    class="w-full py-24 px-6"
  >
    <div class="max-w-6xl mx-auto grid md:grid-cols-2 gap-12 items-center fade-in">

      <div>
        <h2
          data-template-id="about-title"
          class="canva-text font-western text-4xl text-mustard mb-6"
        ></h2>

        <p
          data-template-id="about-text"
          class="canva-text text-cream/80 leading-relaxed mb-4"
        ></p>

        <p
          data-template-id="about-text-2"
          class="canva-text text-cream/60 leading-relaxed"
        ></p>
      </div>
    </div>
  </section>

  <!-- Productos -->
  <section
    id="productos"
    class="w-full py-24 px-6 bg-gradient-to-b from-brown to-[#2a1a15]"
  >
    <div class="max-w-6xl mx-auto text-center mb-16 fade-in">
      <h2
        data-template-id="products-title"
        class="canva-text font-western text-5xl text-mustard mb-4"
      ></h2>

      <p
        data-template-id="products-subtitle"
        class="canva-text text-cream/60"
      ></p>
    </div>

    <div class="max-w-6xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
      <!-- Smores -->
      <div class="product-card fade-in rounded-xl overflow-hidden bg-[#4a3228] border border-mustard/10">

    rel="noopener noreferrer"
    class="fixed bottom-6 right-6 z-50 bg-green-600 hover:bg-green-700 text-white p-4 rounded-full shadow-lg transition-transform hover:scale-110"

  <script src="/_sdk/editing_sdk.js"></script>

  <script>
    lucide.createIcons();

    /*
      Número de WhatsApp:
      +504 31508201
      Formato para el enlace:
      50431508201
    */
    const WHATSAPP_NUMBER = "50431508201";

    // Animaciones de entrada
    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry, index) => {
          if (entry.isIntersecting) {
            setTimeout(() => {
              entry.target.classList.add("visible");
            }, index * 100);

            observer.unobserve(entry.target);
          }
        });
      },
      {
        threshold: 0.1
      }
    );

    document.querySelectorAll(".fade-in").forEach((element) => {
      observer.observe(element);
    });

    // Carrito
    const cart = {};

    const cartItems = document.getElementById("cart-items");
    const cartEmpty = document.getElementById("cart-empty");
    const cartFooter = document.getElementById("cart-footer");
    const cartBadge = document.getElementById("cart-badge");
    const cartTotal = document.getElementById("cart-total");

    function addToCart(id, name, price) {
      if (cart[id]) {
        cart[id].qty++;
      } else {
        cart[id] = {
          name: name,
          price: price,
          qty: 1
        };
      }

      renderCart();
    }

    function addSelectedProduct(id, name, price, optionId) {
      const option = document.getElementById(optionId).value;

      if (id === "palomitas") {
        const popcornPrices = {
          "Pequeñas": 20,
          "Medianas": 30,
          "Grandes": 45
        };
        price = popcornPrices[option] || 20;
      }

      const cartId = id + "-" + option;
      const displayName = name + " — " + option;

      if (cart[cartId]) {
        cart[cartId].qty++;
      } else {
        cart[cartId] = {
          name: displayName,
          price: price,
          qty: 1
        };
      }

      renderCart();
    }

    function removeFromCart(id) {
      delete cart[id];
      renderCart();
    }

    function changeQty(id, delta) {
      if (!cart[id]) {
        return;
      }

      cart[id].qty += delta;

      if (cart[id].qty <= 0) {
        delete cart[id];
      }

      renderCart();
    }

    function renderCart() {
      const keys = Object.keys(cart);

      const count = keys.reduce((sum, key) => {
        return sum + cart[key].qty;
      }, 0);

      cartBadge.textContent = count;
      cartBadge.classList.toggle("hidden", count === 0);

      if (keys.length === 0) {
        cartItems.innerHTML = "";
        cartEmpty.classList.remove("hidden");
        cartFooter.classList.add("hidden");
        return;
      }

      cartEmpty.classList.add("hidden");
      cartFooter.classList.remove("hidden");

      cartItems.innerHTML = keys
        .map((key) => {
          const item = cart[key];

          return `
            <div class="flex items-center justify-between bg-brown/50 rounded-lg p-3">
              <div class="flex-1">
                <div class="text-cream font-bold text-sm">
                  ${item.name}
                </div>

                <div class="text-cream/50 text-xs">
                  L.${item.price} c/u
                </div>
              </div>

              <div class="flex items-center gap-2">
                <button
                  onclick="changeQty('${key}', -1)"
                  class="w-7 h-7 rounded bg-mustard/20 text-mustard flex items-center justify-center font-bold"
                >
                  −
                </button>

                <span class="text-cream w-6 text-center text-sm">
                  ${item.qty}
                </span>

                <button
                  onclick="changeQty('${key}', 1)"
                  class="w-7 h-7 rounded bg-mustard/20 text-mustard flex items-center justify-center font-bold"
                >
                  +
                </button>

                <button
                  onclick="removeFromCart('${key}')"
                  class="ml-2 text-cream/40 hover:text-red-400"
                  aria-label="Eliminar producto"
                >
                  <i data-lucide="trash-2" style="width: 16px; height: 16px;"></i>
                </button>
              </div>
            </div>
          `;
        })
        .join("");

      lucide.createIcons();

      const total = keys.reduce((sum, key) => {
        return sum + cart[key].price * cart[key].qty;
      }, 0);

      cartTotal.textContent = "L." + total.toLocaleString();
    }

    function openCart() {
      document.getElementById("cart-panel").classList.add("open");
      document.getElementById("cart-overlay").classList.add("open");
    }

    function closeCart() {
      document.getElementById("cart-panel").classList.remove("open");
      document.getElementById("cart-overlay").classList.remove("open");
    }

    document
      .getElementById("cart-toggle")
      .addEventListener("click", openCart);

    // Pedido por WhatsApp
    function orderWhatsApp() {
      const keys = Object.keys(cart);

      if (!keys.length) {
        return;
      }

      let message = "¡Hola! Me gustaría ordenar:\n\n";
      let total = 0;

      keys.forEach((key) => {
        const item = cart[key];

        message +=
          "• " +
          item.name +
          " x" +
          item.qty +
          " — L." +
          item.price * item.qty +
          "\n";

        total += item.price * item.qty;
      });

      message += "\nTotal: L." + total.toLocaleString();
      message += "\n\n¡Gracias!";

      const whatsappUrl =
        "https://wa.me/" +
        WHATSAPP_NUMBER +
        "?text=" +
        encodeURIComponent(message);

      window.open(whatsappUrl, "_blank");
    }
  </script>
</body>
</html>
